<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--
      Yago, aqui tu pode trocar o título dinâmico de cada página depois.
      Por enquanto deixei um título padrão do sistema.
    -->
    <title th:text="${pageTitle} ?: 'SIAC - Sistema Integrado de Atendimento do CRDH'">
        SIAC - Sistema Integrado de Atendimento do CRDH
    </title>

    <!--
      Yago, salva o favicon em:
      src/main/resources/static/img/favicon.ico

      Se quiser trocar depois, mantém só o nome do arquivo e altera aqui.
    -->
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
    >

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!--
      Yago, aqui entra teu CSS global do sistema.
      Salva em:
      src/main/resources/static/css/app.css
    -->
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <style>
        /*
          Yago, esse CSS já deixa o layout base funcional mesmo antes de tu criar o app.css.
          Depois, se quiser, pode mover tudo isso para /static/css/app.css.
        */

        :root {
            --siac-sidebar-width: 290px;
            --siac-sidebar-bg: #0f6b3c;
            --siac-sidebar-border: #0b4f2c;
            --siac-sidebar-hover: #166534;
            --siac-body-bg: #f5f7fa;
            --siac-content-bg: #ffffff;
            --siac-text-muted: #6c757d;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--siac-body-bg);
            overflow-x: hidden;
        }

        .siac-app {
            min-height: 100vh;
        }

        /*
          SIDEBAR DESKTOP
          Yago, no desktop a sidebar fica fixa na lateral esquerda.
        */
        .siac-sidebar-desktop {
            width: var(--siac-sidebar-width);
            min-width: var(--siac-sidebar-width);
            max-width: var(--siac-sidebar-width);
            background-color: var(--siac-sidebar-bg);
            border-right: 1px solid var(--siac-sidebar-border);
            min-height: 100vh;
            position: sticky;
            top: 0;
        }

        /*
          ÁREA PRINCIPAL
          Yago, essa é a área onde vão entrar dashboard, formulários, relatórios etc.
        */
        .siac-main {
            min-width: 0;
            flex: 1;
        }

        /*
          TOPBAR
          Yago, essa barra superior aparece no conteúdo principal.
          No mobile ela mostra o botão para abrir o menu lateral.
        */
        .siac-topbar {
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
            position: sticky;
            top: 0;
            z-index: 1020;
        }

        .siac-page-wrapper {
            padding: 1rem;
        }

        @media (min-width: 768px) {
            .siac-page-wrapper {
                padding: 1.5rem;
            }
        }

        @media (min-width: 1200px) {
            .siac-page-wrapper {
                padding: 2rem;
            }
        }

        /*
          CARD/CONTEÚDO PADRÃO
          Yago, isso aqui te dá um container bonito para as páginas.
          Se não quiser usar depois, pode remover.
        */
        .siac-page-card {
            background-color: var(--siac-content-bg);
            border: 1px solid #e9ecef;
            border-radius: 1rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04);
            padding: 1rem;
        }

        @media (min-width: 768px) {
            .siac-page-card {
                padding: 1.5rem;
            }
        }

        @media (min-width: 1400px) {
            .siac-page-card {
                padding: 2rem;
            }
        }

        @media (min-width: 992px) {
            .siac-main {
                margin-left: 290px;
            }
        }

        .siac-page-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        @media (min-width: 768px) {
            .siac-page-title {
                font-size: 1.5rem;
            }
        }

        .siac-page-subtitle {
            color: var(--siac-text-muted);
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        /*
          OFFCANVAS MOBILE
          Yago, aqui a sidebar vira menu lateral deslizante em telas menores.
        */
        .offcanvas.siac-offcanvas {
            background-color: var(--siac-sidebar-bg);
            color: #fff;
            width: min(85vw, 320px);
        }

        .offcanvas.siac-offcanvas .offcanvas-header {
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .offcanvas.siac-offcanvas .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
    </style>
</head>
<body>
<div class="siac-app d-flex">

    <!--
      =========================================================
      SIDEBAR DESKTOP
      =========================================================
      Yago, essa sidebar aparece apenas em telas grandes (lg para cima).
      Aqui está sendo chamado o fragmento:
      templates/layout/fragments/sidebar.html

      Então teu arquivo sidebar.html precisa ter:
      <div th:fragment="sidebar">...</div>
    -->
    <div class="d-none d-lg-block">
        <div th:replace="layout/fragments/sidebar :: sidebar"></div>
    </div>

    <!--
      =========================================================
      CONTEÚDO PRINCIPAL
      =========================================================
    -->
    <div class="siac-main d-flex flex-column">

        <!--
          =========================================================
          TOPBAR
          =========================================================
          Yago, aqui fica a barra superior do conteúdo.
          No mobile/tablet menor, esse botão abre a sidebar.
        -->
        <header class="siac-topbar">
            <div class="container-fluid px-3 px-md-4 py-3">
                <div class="d-flex align-items-center justify-content-between gap-3">

                    <div class="d-flex align-items-center gap-3 min-w-0">
                        <!--
                          Yago, esse botão só aparece abaixo de lg.
                          Ele abre a sidebar mobile.
                        -->
                        <button
                                class="btn btn-outline-success d-lg-none"
                                type="button"
                                data-bs-toggle="offcanvas"
                                data-bs-target="#mobileSidebar"
                                aria-controls="mobileSidebar"
                        >
                            <i class="bi bi-list fs-5"></i>
                        </button>

                        <!--
                          Yago, esse é o título da página.
                          Depois cada controller pode mandar algo tipo:
                          model.addAttribute("pageTitle", "Dashboard");
                        -->
                        <div class="min-w-0">
                            <h1 class="h5 mb-0 text-truncate"
                                th:text="${pageTitle} ?: 'SIAC'">
                                SIAC
                            </h1>

                            <!--
                              Yago, esse subtítulo é opcional.
                              Tu pode mandar pelo controller também:
                              model.addAttribute("pageSubtitle", "Painel inicial do sistema");
                            -->
                            <small class="text-muted d-none d-sm-block"
                                   th:text="${pageSubtitle} ?: 'Sistema Integrado de Atendimento do CRDH'">
                                Sistema Integrado de Atendimento do CRDH
                            </small>
                        </div>
                    </div>

                    <!--
                      Yago, aqui fica a área da direita da topbar.
                      Depois tu pode colocar:
                      - nome do usuário logado
                      - botão sair
                      - notificações
                      - perfil
                    -->
                    <div class="d-flex align-items-center gap-2 gap-md-3">
                        <span class="text-muted small d-none d-md-inline">
                            Usuário logado
                        </span>

                        <!--
                          Yago, depois aqui tu pode trocar por algo assim:
                          <span th:text="${nomeUsuarioLogado}">Yago Moreira</span>
                        -->
                        <div class="dropdown">
                            <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle me-1"></i>
                                <span class="d-none d-sm-inline">Conta</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <!--
                                  Yago, depois isso pode virar rota de perfil.
                                -->
                                <li><a class="dropdown-item" href="#">Meu perfil</a></li>

                                <!--
                                  Yago, aqui depois tu pode colocar troca de senha.
                                -->
                                <li><a class="dropdown-item" href="#">Alterar senha</a></li>

                                <li><hr class="dropdown-divider"></li>

                                <!--
                                  Yago, aqui depois entra a rota de logout do Spring Security.
                                  Exemplo futuro:
                                  <form th:action="@{/logout}" method="post">...</form>
                                -->
                                <li><a class="dropdown-item text-danger" href="#">Sair</a></li>
                            </ul>
                        </div>
                    </div>

                </div>
            </div>
        </header>

        <!--
          =========================================================
          CONTEÚDO DA PÁGINA
          =========================================================
          Yago, essa área é o "miolo" do sistema.
          Aqui vai entrar o conteúdo específico de cada tela:
          - dashboard
          - usuários
          - profissionais
          - atendimentos
          - relatórios

          A forma mais organizada depois é usar fragmentos de conteúdo.
        -->
        <main class="flex-grow-1">
            <div class="siac-page-wrapper">
                <div class="siac-page-card">

                    <div class="mb-4">
                        <h2 class="siac-page-title"
                            th:text="${contentTitle} ?: 'Conteúdo da Página'">
                            Conteúdo da Página
                        </h2>

                        <p class="siac-page-subtitle"
                           th:text="${contentSubtitle} ?: 'Aqui será renderizado o conteúdo principal da tela.'">
                            Aqui será renderizado o conteúdo principal da tela.
                        </p>
                    </div>

                    <!-- Yago, aqui entra o conteúdo específico da página -->
                    <div th:replace="${pageContent}"></div>

                </div>
            </div>
        </main>
    </div>
</div>

<!--
  =========================================================
  SIDEBAR MOBILE / TABLET MENOR
  =========================================================
  Yago, aqui a mesma sidebar é reutilizada no mobile.
  Assim tu não precisa criar duas sidebars diferentes.
-->
<div class="offcanvas offcanvas-start siac-offcanvas" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="mobileSidebarLabel">Menu do Sistema</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
    </div>

    <div class="offcanvas-body p-0">
        <div th:replace="layout/fragments/sidebar :: sidebar"></div>
    </div>
</div>

<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
></script>

<!--
  Yago, aqui entra teu JS customizado.
  Salva em:
  src/main/resources/static/js/app.js
-->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
